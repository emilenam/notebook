name: verify

on:
  push:
    branches:
    - master
  pull_request:

jobs:
  paths-filter:
    runs-on: ubuntu-latest
    outputs:
      lib: ${{ steps.filter.outputs.lib }}
      tests: ${{ steps.filter.outputs.tests }}
    steps:
    - uses: actions/checkout@v3
    - uses: dorny/paths-filter@v4
      id: filter
      with:
        filters: |
          lib:
            - 'lib/**.h'
          tests:
            - 'tests/**.cpp'
            - 'tests/**.h'
  verify:
    runs-on: ubuntu-latest
    needs: paths-filter
    if: needs.paths-filter.outputs.lib == 'true' || needs.paths-filter.outputs.tests == 'true'
    steps:
    - uses: actions/checkout@v3
    - name: Set up Python
      uses: actions/setup-python@v4
    - name: Install dependencies
      run: pip3 install -U online-judge-verify-helper
    - name: Run tests
      run: oj-verify all -j 4

